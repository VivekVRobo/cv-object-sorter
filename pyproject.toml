[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-object-sorter"
version = "0.2.0"
description = "OpenCV color-object detection, passage-aware triggering, evaluation, and serial sorter control"
requires-python = ">=3.10"
authors = [{name = "Vivek Vala"}]
dependencies = [
  "opencv-python>=4.8,<5",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "pyserial>=3.5,<4",
]

[project.scripts]
cv-object-sorter = "cv_sorter.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
